version: "4.1"
name: BootLoader
type: ARM
deviceName: null
packDir: .pack/Keil/STM32F4xx_DFP.2.14.0
srcDirs:
  - Core
  - Drivers
  - FATFS
  - Middlewares
  - APP
  - BSP
  - SVC
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: startup
      files:
        - path: startup_stm32f407xx.s
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: a2b8e9a46f19d49a18fc09d4ba701590
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F407xx
        - LV_CONF_INCLUDE_SIMPLE
      incList:
        - .
        - Core/Inc
        - FATFS/App
        - FATFS/Target
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FatFs/src
        - Drivers/CMSIS/Include
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - BSP/at24c02
        - BSP/key
        - BSP/lcd
        - BSP/led
        - BSP/w25qxx
        - APP/key
        - APP/lcd
        - APP/led
        - APP/touch
        - APP/uart
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - BSP/touch
        - Middlewares/Third_Party/lvgl/include
        - Middlewares/Third_Party/lvgl
        - APP/ui
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x5000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x10000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            $toolName: auto
            LD_FLAGS: -u _printf_float
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F407xx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
